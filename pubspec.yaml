name: zedu
description: "A lean Flutter Clean Architecture starter for Material apps."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  audioplayers: ^6.6.0
  agora_rtc_engine: ^6.5.4
  cross_file: ^0.3.5+2
  desktop_drop: ^0.7.1
  app_links: ^7.0.0
  dio: ^5.9.2
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.2.0
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^17.2.2
  google_sign_in_all_platforms: ^2.0.2
  url_launcher: ^6.3.2
  google_fonts: ^8.1.0
  intl: ^0.19.0
  record: ^6.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  local_notifier: ^0.1.6
  riverpod: ^3.2.1
  state_notifier: ^1.0.0
  super_clipboard: ^0.9.1
  tray_manager: ^0.5.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5


  test: any
flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/pngs/
    - assets/svgs/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto/Roboto-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/Roboto-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto/Roboto-Black.ttf
          weight: 900
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato/Lato-Thin.ttf
          weight: 100
        - asset: assets/fonts/Lato/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato/Lato-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato/Lato-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Lato/Lato-Black.ttf
          weight: 900
        - asset: assets/fonts/Lato/Lato-BlackItalic.ttf
          weight: 900
          style: italic
