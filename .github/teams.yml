# Bootcamp teams, keyed by the GitHub org that owns each team's fork.
# Read by Lead approval and Team routing from the base branch, so a PR can't change its own mapping.
#
# A team is identified by its fork's org (the PR's head repo owner), matched exactly (case-insensitive).
# No member lists: anyone who can push to the team's org fork is on the team, and the team lead
# manages that org. Add an org once and every PR from that fork is covered.
#
# teams:
#   heron:
#     orgs:                 # exact org login(s) owning the team's fork
#       - Zedu-Heron-HNG
#     leads:                # one or more GitHub logins; any one lead can approve
#       - lead-login
#     reviewer: login       # optional: Zedu reviewer for this team, tagged by Team routing
#
# fallback_reviewer: login  # tagged when a PR comes from an unregistered org or a personal fork
#
# Logins are plain (no @). Fill in as teams send their org name and lead handle(s).

fallback_reviewer: logickoder

