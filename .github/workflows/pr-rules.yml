name: PR rules

# Caller: the logic lives in zedu-hng/zedu-ci (pr-rules.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Branch name, Single author, Protected files, Size, PR title and PR template, each a commit status.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions: {}

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: PR rules
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: zedu-hng/zedu-ci/.github/workflows/pr-rules.yml@2ede8e8f507e4527eff462eca646986f289fbd55
    with:
      protected: '^(\.github/|AGENTS\.md$|CONTRIBUTING\.md$|analysis_options\.yaml$|scripts/)'
      size_exclude: '(^|/)(pubspec\.lock|Podfile\.lock)$|\.(g|freezed|mocks)\.dart$|(^|/)generated_plugin_registrant\.'
      template: .github/PULL_REQUEST_TEMPLATE.md
