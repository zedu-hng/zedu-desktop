name: PR Review comment

# Caller: the logic lives in zedu-hng/zedu-ci (pr-review-comment.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Posts each PR checks / PR scans result as a commit status, and the review bot's report as a comment.

on:
  workflow_run:
    workflows: ["PR checks", "PR scans"]
    types:
      - completed

permissions: {}

jobs:
  comment:
    name: PR Review comment
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    uses: zedu-hng/zedu-ci/.github/workflows/pr-review-comment.yml@4e68db81f7dc1ecfbb656308c1a9e9b718eaae0c
