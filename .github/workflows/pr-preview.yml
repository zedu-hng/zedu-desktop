name: PR preview

# Stage B: trusted context. Runs this file from the default branch, never checks out PR code,
# and only reads artifacts produced by "PR build". Posts download links on the PR.

on:
  workflow_run:
    workflows:
      - PR build
    types:
      - completed

permissions:
  contents: read

jobs:
  comment:
    name: Post review build links
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: meta
          path: meta

      # meta/pr_number was written by untrusted code: validate its format, then confirm the PR's head matches this run.
      - name: Resolve PR
        id: pr
        run: |
          number=$(cat meta/pr_number)
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "Invalid PR number"; exit 1; }
          pr_head=$(gh api "repos/$REPO/pulls/$number" --jq .head.sha)
          [ "$pr_head" = "$HEAD_SHA" ] || { echo "PR #$number head $pr_head != run head $HEAD_SHA (stale run?)"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Compose comment
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo "### Review builds for \`${HEAD_SHA:0:7}\`"
            echo
            echo "Unsigned macOS, Windows, and Linux builds: [download from the build run]($RUN_URL) (Artifacts section)."
            echo
            echo "- **macOS**: unzip, then right-click the app → Open (or \`xattr -dr com.apple.quarantine Zedu.app\`) to get past Gatekeeper."
            echo "- **Windows**: unzip and run the \`.exe\`; SmartScreen → More info → Run anyway."
            echo "- **Linux**: extract the tarball and run the binary in the bundle root."
          } > comment.md

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: review-builds
          number: ${{ steps.pr.outputs.number }}
          path: comment.md

      - name: Commit status
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=$([ "$JOB_STATUS" = "success" ] && echo success || echo failure)
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" -f context="PR preview / publish" \
            -f target_url="$RUN_URL" -f description="Review build links: $JOB_STATUS"
