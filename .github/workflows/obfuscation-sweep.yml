name: Obfuscation sweep

# Caller: the logic lives in zedu-hng/zedu-ci (obfuscation-sweep.yml), pinned by commit. Weekly scan
# of every file on dev for hidden or obfuscated code already committed (the PR scan only sees what a
# PR adds). A finding fails the run, so the repo's Actions failure notifications fire.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    name: Obfuscation sweep
    if: github.repository == 'zedu-hng/zedu-desktop'
    permissions:
      contents: read
    uses: zedu-hng/zedu-ci/.github/workflows/obfuscation-sweep.yml@4e68db81f7dc1ecfbb656308c1a9e9b718eaae0c
